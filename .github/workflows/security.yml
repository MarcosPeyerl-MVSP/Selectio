name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Check committed secrets
        run: npm run security:check

      - name: Test secret detector
        run: npm run security:test

      - name: Lint
        run: npm run lint

      - name: Test application and document extraction
        run: npm run test:unit

      - name: Test rules, quotas, referrals and concurrent payments
        run: npm run test:security:emulators

      - name: Test Cloud Functions API
        run: npm run test:functions

      - name: Check translation catalogs
        run: npm run i18n:check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Functions dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
